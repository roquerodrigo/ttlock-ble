[project]
name = "ttlock-ble"
version = "0.1.11"
description = "Python SDK for controlling DLock-XP / TTLock smart locks over Bluetooth"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Roque", email = "rodrigogoncalvesroque@gmail.com" }]
keywords = ["ttlock", "smart-lock", "bluetooth", "ble", "sdk", "home-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
]
dependencies = [
    "bleak>=2.1.0",
    "httpx>=0.27.0",
    "cryptography>=44.0.0",
    "bleak-retry-connector>=4.4.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ttlock = "ttlock_ble.cli:app"

[project.urls]
Homepage = "https://github.com/roquerodrigo/ttlock-ble"
Repository = "https://github.com/roquerodrigo/ttlock-ble"
Issues = "https://github.com/roquerodrigo/ttlock-ble/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ttlock_ble"]

[tool.hatch.build.targets.wheel.force-include]
"src/ttlock_ble/py.typed" = "ttlock_ble/py.typed"

# The source distribution carries the library and its documentation only. The
# test suite, the local tooling and the CI definitions are development assets:
# shipping them to PyPI publishes fixtures nobody installing the SDK can use.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/ttlock_ble",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pre-commit==4.6.2",
    "hatchling==1.32.0",
    "ttlock-ble[cli]",
]
lint = [
    "ruff==0.16.4",
    "mypy==2.3.1",
]

[tool.uv]
default-groups = ["dev", "lint"]

# Every rule ruff knows is enabled; each exemption below states why it is
# unavoidable here and is scoped to the files that actually need it.

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.format]
exclude = ["*.md"] # ruff 0.16 formats Python blocks in Markdown; docs keep their own layout

[tool.ruff.lint]
select = [
    "ALL",
]

ignore = [
    "COM812",  # incompatible with the formatter
    "CPY001",  # copyright headers are not used in this project
    "D203",    # no-blank-line-before-class (incompatible with the formatter)
    "D213",    # mutually exclusive with D212; we pick D212-style summaries
    "EM101",   # raise(str) is fine — inlining helps grep, no message variable needed
    "EM102",   # same for f-strings inside raise
    "ISC001",  # incompatible with the formatter
    "PLR2004", # magic byte values are the protocol — extracting them all hurts readability
    "TID252",  # relative imports between same-package siblings are the house style
    "TRY003",  # long exception messages are OK when the message carries diagnostics
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",      # type annotations not required in tests
    "ARG001",   # unused fixtures are normal
    "D",        # docstrings not required in tests
    "ERA001",   # protocol-byte-layout comments are valuable in payload tests
    "PLC0415",  # imports inside a test body keep the failure local to that case
    "PT011",    # pytest.raises bare ValueError is fine when the message isn't tested
    "PT018",    # composite assertion is normal in tests
    "S101",     # asserts are the point of tests
    "S105",     # tests carry expected passcode values inline
    "SLF001",   # tests intentionally exercise private members
]
"src/ttlock_ble/cli.py" = [
    "FBT001",   # boolean-positional in typer commands is the framework idiom
    "FBT003",   # so is the boolean positional passed to typer.Option
]
"src/ttlock_ble/ble/transport.py" = [
    "S101",     # asserts narrow Optional GATT handles for mypy after connect()
]
"src/ttlock_ble/models/*.py" = [
    "N815",     # cloud-facing dataclass fields keep upstream camelCase
]
"scripts/**" = [
    "D",        # one-shot CLI helpers self-document via argparse help
    "T201",     # operator scripts print their output to the terminal
    "TC001",    # runtime-imported types are clearer than TYPE_CHECKING gymnastics
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
files = ["src"]
python_version = "3.14"
strict = true
disallow_any_explicit = true
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "silent"
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--cov=src/ttlock_ble",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
