[project]
name = "ttlock-ble"
version = "0.1.10"
description = "Python SDK for controlling DLock-XP / TTLock smart locks over Bluetooth"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Roque", email = "rodrigogoncalvesroque@gmail.com" }]
keywords = ["ttlock", "smart-lock", "bluetooth", "ble", "sdk", "home-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
]
dependencies = [
    "bleak>=2.1.0",
    "httpx>=0.27.0",
    "cryptography>=44.0.0",
    "bleak-retry-connector>=4.4.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ttlock = "ttlock_ble.cli:app"

[project.urls]
Homepage = "https://github.com/roquerodrigo/ttlock-ble"
Repository = "https://github.com/roquerodrigo/ttlock-ble"
Issues = "https://github.com/roquerodrigo/ttlock-ble/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ttlock_ble"]

[tool.hatch.build.targets.wheel.force-include]
"src/ttlock_ble/py.typed" = "ttlock_ble/py.typed"

# The source distribution carries the library and its documentation only. The
# test suite, the local tooling and the CI definitions are development assets:
# shipping them to PyPI publishes fixtures nobody installing the SDK can use.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/ttlock_ble",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pre-commit==4.6.1",
    "hatchling==1.28.0",
    "ttlock-ble[cli]",
]
lint = [
    "ruff==0.16.1",
    "mypy==2.3.0",
]

[tool.uv]
default-groups = ["dev", "lint"]

# Lint rule choices are based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
exclude = ["*.md"] # ruff 0.16 formats Python blocks in Markdown; docs keep their own layout

[tool.ruff.lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # typing.Any disallowed — not always avoidable at framework boundaries
    "D203",   # no-blank-line-before-class (incompatible with formatter)
    "D212",   # multi-line-summary-first-line (incompatible with formatter)
    "D213",   # mutually exclusive with D212; we pick D212-style summaries
    "D107",   # __init__ docstring covered by class docstring
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    "EM101",  # raise(str) is fine — format helps grep, no string variable needed
    "EM102",  # same for f-strings inside raise
    "TRY003", # long exception messages are OK when the message carries diagnostics
    "TID252", # relative imports between same-package siblings are intentional
    "PLR2004", # magic byte values are the protocol — extracting them all hurts readability
    "PLC0415", # lazy imports break a couple of circular deps; intentional
    "FBT003",  # boolean positional in typer.Option calls is the framework idiom
    "S101",    # we keep asserts as type-narrowing aids for mypy; cheap in CPython
    "CPY001", # copyright headers are not used in this project
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # asserts are the point of tests
    "S105",     # tests carry expected passcode/secret values inline
    "SLF001",   # tests intentionally exercise private members
    "ARG001",   # unused fixtures are normal
    "PLR2004",  # magic numbers in tests are fine
    "D",        # docstrings not required in tests
    "ANN",      # type annotations not required in tests
    "ERA001",   # protocol-byte-layout comments are valuable in payload tests
    "PT011",    # pytest.raises bare ValueError is fine when message isn't tested
    "PT018",    # composite assertion is normal in tests
    "PLC0415",  # local imports inside test methods are normal
    "PYI034",   # Self return type isn't relevant in test fixtures
]
"src/ttlock_ble/cli.py" = [
    "D",        # typer commands self-document via help=
    "BLE001",   # CLI handlers convert any error into typer.Exit
    "FBT001",   # boolean-positional in typer commands is the framework idiom
    "FBT002",
]
"src/ttlock_ble/models/*.py" = [
    "N815",     # cloud-facing dataclass fields keep upstream camelCase
]
"scripts/**" = [
    "T201",     # operator scripts print their output to the terminal
    "D",        # one-shot CLI helpers self-document via argparse help
    "TC001",    # runtime-imported types are clearer than TYPE_CHECKING gymnastics
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "silent"
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
# bleak callback signatures resolve to `Any` without bundled stubs;
# silence the explicit-any complaints they trigger here.
module = "ttlock_ble.client"
disable_error_code = ["explicit-any"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--cov=src/ttlock_ble",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
